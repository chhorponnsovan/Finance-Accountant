<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt Splitter</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <h1>🧾 Receipt Splitter</h1>

  <details id="settings">
    <summary>⚙️ Settings (saved in this browser only)</summary>
    <label>Apps Script Web App URL <input id="url" placeholder="https://script.google.com/macros/s/.../exec"></label>
    <label>Secret token <input id="token" type="password" placeholder="same as TOKEN in Code.gs"></label>
    <div><b>Participants</b> <small>(names must match the sheet's column headers)</small></div>
    <div id="people" class="chips"></div>
    <div class="row"><input id="newPerson" placeholder="Add a person"><button id="addPerson">Add</button></div>
  </details>

  <section class="card">
    <div class="row">
      <label class="drop" style="flex:1">🖼 Choose from Photos / Files
        <input id="file" type="file" accept="image/*" hidden>
      </label>
      <label class="drop" style="flex:1">📷 Take a photo
        <input id="cam" type="file" accept="image/*" capture="environment" hidden>
      </label>
    </div>
    <div id="status" role="status"></div>
    <div class="row">
      <input id="store" placeholder="Store (optional)">
      <input id="date" type="date">
    </div>
  </section>

  <section id="items"></section>
  <div class="row">
    <button id="addItem">+ Add item</button>
  </div>

  <section class="card" id="summary"></section>
  <button id="submit" class="primary">Send to Google Sheet</button>
  <div id="result" role="status"></div>
</main>
<script src="app.js"></script>
</body>
</html>
